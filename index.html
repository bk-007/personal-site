<style>
:root{color-scheme:dark;--bg:#050505;--fg:#f5f5f2;--accent:#f5f5f2;--accent2:#999;--glow:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 48%,var(--glow),transparent 38%),var(--bg);transition:background 1s ease}
.stage:before{content:"";position:absolute;inset:-20%;z-index:-1;opacity:.22;background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15) 0 .7px,transparent .8px),radial-gradient(circle at 70% 65%,rgba(255,255,255,.08) 0 .6px,transparent .7px);background-size:18px 18px,27px 27px;animation:drift 16s linear infinite}

.message{position:absolute;margin:0;font-size:clamp(3rem,10vw,9rem);font-weight:700;line-height:.95;letter-spacing:-.065em;opacity:0;filter:blur(12px);transform:scale(.96) translateY(12px);will-change:transform,opacity,filter;text-wrap:balance}
.message.show{animation:arrive .5s cubic-bezier(.2,.8,.2,1) forwards}
.message.leave{animation:leave .45s cubic-bezier(.7,0,.9,.4) forwards}
.message.goodbye{font-style:italic;font-weight:650}
.flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.flash.go{animation:flash .5s ease-out forwards}
.shock{position:fixed;left:50%;top:50%;width:10vmin;aspect-ratio:1;border:2px solid rgba(255,255,255,.95);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.2);pointer-events:none;z-index:20}
.shock.go{animation:shock .8s cubic-bezier(.1,.7,.2,1) forwards}
.particle{position:fixed;left:50%;top:50%;width:var(--size);height:var(--size);border-radius:1px;background:var(--particle,var(--accent));opacity:var(--alpha);transform:translate(-50%,-50%);z-index:15;pointer-events:none;animation:explode var(--duration) cubic-bezier(.08,.7,.18,1) forwards}
.shard{position:fixed;left:50%;top:50%;width:var(--w);height:var(--h);background:var(--accent2);opacity:.9;clip-path:polygon(50% 0,100% 100%,0 72%);transform:translate(-50%,-50%);z-index:14;pointer-events:none;animation:shardFly var(--duration) cubic-bezier(.08,.65,.18,1) forwards}
.after{position:fixed;inset:0;display:grid;place-items:center;opacity:0;z-index:30;pointer-events:none;background:#000;transition:opacity 1s ease 1.1s}
.after.show{opacity:1;pointer-events:auto}
.replay{border:0;padding:14px 18px;color:rgba(255,255,255,.42);background:transparent;font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .8s ease 2s,transform .8s ease 2s,color .2s ease}
.after.show .replay{opacity:1;transform:translateY(0)}
.replay:hover,.replay:focus-visible{color:#fff;outline:none}
.signature{position:fixed;cursor:pointer;user-select:none;transition:color .2s ease,opacity .2s ease,transform .2s ease}.signature:hover{color:rgba(255,255,255,.75)!important;transform:translateY(-1px)}
.glass-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.16);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s ease}
.glass-backdrop.open{opacity:1;pointer-events:auto}
.glass-sheet{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:81;width:min(92vw,430px);padding:10px;border:1px solid rgba(255,255,255,.22);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.075));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.2),0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);transform:translate(-50%,calc(100% + 45px)) scale(.96);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.2,.85,.2,1),opacity .25s ease}
.glass-sheet.open{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.glass-highlight{position:absolute;inset:1px;border-radius:29px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 28%,transparent 70%,rgba(255,255,255,.06));mask:linear-gradient(#000,transparent 55%)}
.glass-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px}.glass-title{font-size:17px;font-weight:650;letter-spacing:-.02em}.glass-close{width:32px;height:32px;border:1px solid rgba(255,255,255,.13);border-radius:50%;color:#fff;background:rgba(255,255,255,.09);font-size:18px;cursor:pointer}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:4px}.theme-btn,.glass-link{border:1px solid rgba(255,255,255,.12);border-radius:19px;background:rgba(255,255,255,.075);color:#fff;min-height:54px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:background .18s ease,transform .18s ease,border-color .18s ease}.theme-btn:hover,.glass-link:hover{background:rgba(255,255,255,.14)}.theme-btn:active,.glass-link:active{transform:scale(.975)}.theme-btn.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.34)}.theme-name{display:block;font-size:13px;font-weight:620}.theme-dots{display:flex;gap:4px;margin-top:6px}.theme-dots i{width:8px;height:8px;border-radius:50%;background:var(--dot)}.glass-link{display:flex;align-items:center;justify-content:space-between;margin:7px 4px 4px;text-decoration:none;font-size:14px;font-weight:620}.glass-link span:last-child{opacity:.55;font-size:18px}

.dust{position:fixed;z-index:25;pointer-events:none;width:var(--s);height:var(--s);left:var(--x0);top:var(--y0);background:var(--dust);opacity:var(--o);border-radius:var(--round);box-shadow:0 0 var(--blur) color-mix(in srgb,var(--dust) 42%,transparent);transform:translate(0,0) rotate(0) scale(1);animation:dustAway var(--dur) cubic-bezier(.16,.55,.25,1) var(--delay) forwards}
.dust.smoke{filter:blur(1.2px);opacity:.34}

@keyframes dustAway{0%{opacity:var(--o);transform:translate(0,0) rotate(0) scale(1)}35%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.15)}}
@keyframes textErode{0%{-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 100%);mask-image:linear-gradient(90deg,#000 0%,#000 100%)}15%{-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 100%)}100%{-webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,transparent 100%);opacity:0;filter:blur(3px)}}

.holiday-mark{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:5;color:var(--accent);opacity:.34;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* Distinct seasonal personalities */
.message{color:var(--text,var(--fg));font-family:var(--font,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif);text-shadow:var(--text-shadow,none);transition:color .45s ease,text-shadow .45s ease}

body[data-theme="halloween"] .message{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.035em;text-shadow:0 0 18px rgba(255,122,0,.28),0 3px 0 rgba(90,20,110,.3)}
body[data-theme="halloween"] .stage:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 105%,rgba(255,93,0,.13),transparent 42%),linear-gradient(180deg,transparent 55%,rgba(87,31,110,.1));animation:halloweenPulse 4s ease-in-out infinite alternate}

body[data-theme="labor"] .message{font-family:"Helvetica Neue",Arial,sans-serif;color:#edf3ff;font-weight:650;letter-spacing:-.055em;text-shadow:0 0 24px rgba(115,147,201,.26)}
body[data-theme="auto"] .message{color:#f5f5f2}
.ambient .snow{width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:var(--o);top:-10px;left:var(--x);animation:snowFall var(--d) linear infinite;animation-delay:var(--delay)}
.ambient .ember{width:var(--s);height:var(--s);border-radius:50%;background:#ff7a00;box-shadow:0 0 8px #ff7a00;opacity:var(--o);bottom:-10px;left:var(--x);animation:emberRise var(--d) ease-in infinite;animation-delay:var(--delay)}
.ambient .sparkle{width:3px;height:3px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);left:var(--x);top:var(--y);animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--delay)}
.ambient .heart{color:#ff7aa6;font-size:var(--s);left:var(--x);bottom:-30px;opacity:var(--o);animation:heartFloat var(--d) linear infinite;animation-delay:var(--delay)}
.ambient .pastel{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);left:var(--x);top:var(--y);opacity:.18;filter:blur(1px);animation:pastelFloat var(--d) ease-in-out infinite alternate}
.psl{position:fixed;right:clamp(20px,7vw,90px);bottom:clamp(42px,8vh,90px);z-index:2;width:clamp(78px,10vw,118px);height:clamp(100px,13vw,145px);opacity:0;transform:translateY(18px) rotate(3deg);pointer-events:none;transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1)}

.psl-cup{position:absolute;left:17%;bottom:0;width:66%;height:72%;border:1.5px solid var(--accent);border-top:0;border-radius:8% 8% 24% 24%/8% 8% 13% 13%;background:transparent;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 16%,transparent)}

.psl-mark:before{content:"";position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border:1px solid var(--accent2);border-radius:50% 50% 45% 45%;background:transparent}

.psl-steam.s1{left:38%}.psl-steam.s2{left:57%;animation-delay:-1.3s;height:22%}
body[data-theme="halloween"] .psl-cup{background:transparent}
body[data-theme="halloween"] .psl{filter:drop-shadow(0 0 12px rgba(255,122,0,.16))}

<body>
<main class="stage" aria-live="polite">
<div class="ambient" aria-hidden="true"></div>
<div class="psl" aria-hidden="true">
  <div class="psl-steam s1"></div><div class="psl-steam s2"></div>
  <div class="psl-foam"></div><div class="psl-spice"></div><div class="psl-lid"></div>
  <div class="psl-cup"><div class="psl-mark"></div></div>
</div>
<div class="wrap"><p class="message">Hello.</p></div>
<div class="shock" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div>
<div class="menu-cue" aria-hidden="true"><span>themes + links</span><span class="arrow">↙</span></div>

<div class="glass-backdrop" aria-hidden="true"></div>
<section class="glass-sheet" role="dialog" aria-modal="true" aria-label="Site themes">
  <div class="glass-highlight"></div>
  <div class="glass-head"><div class="glass-title">Choose a vibe</div><button class="glass-close" type="button" aria-label="Close">×</button></div>
  <div class="theme-grid"></div>
  <a class="glass-link" href="https://linkedin.com/in/brycek" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span><span>↗</span></a>
</section>
<div class="holiday-mark" aria-hidden="true"></div>
<div class="after"><button class="replay" type="button">Again?</button></div>
</main>
<script>
const phrases=[["Hello.",2100],["Welcome to my site.",2700],["Goodbye.",2000]];

function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(y,month-1,day);
}
function themeFor(d=new Date()){
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),md=m*100+day, easter=easterDate(y), delta=Math.round((d-easter)/86400000);
  if(md>=1227||md<=102)return {name:"New Year",bg:"#02040a",a:"#ffd86b",b:"#70b7ff",particles:["#ffd86b","#70b7ff","#ff6b9d","#ffffff"]};
  if(md>=1201&&md<=1226)return {name:"Christmas",bg:"#06100b",a:"#e63946",b:"#f4e8c1",particles:["#e63946","#2a9d55","#f4e8c1","#ffffff"]};
  if(md>=1101&&md<=1130)return {name:"Thanksgiving",bg:"#160b04",a:"#e08a2e",b:"#f3c178",particles:["#e08a2e","#8f4e20","#f3c178","#b86b32"]};
  if(md>=1001&&md<=1031)return {name:"Halloween",bg:"#08040d",a:"#ff7a00",b:"#8d4bd6",particles:["#ff7a00","#8d4bd6","#f3e6c8","#5b247a"]};
  if(md>=207&&md<=214)return {name:"Valentine's",bg:"#17040b",a:"#ff4f87",b:"#ffd1df",particles:["#ff4f87","#ff8fb3","#ffd1df","#ffffff"]};
  if(md>=301&&md<=317)return {name:"St. Patrick's",bg:"#031109",a:"#35c96f",b:"#d8c36a",particles:["#35c96f","#0f7d3e","#d8c36a","#ffffff"]};
  if(delta>=-14&&delta<=7)return {name:"Easter",bg:"#0b0915",a:"#c9a7ff",b:"#ffe49a",particles:["#c9a7ff","#ffd0df","#b8e8d0","#ffe49a"]};
  if(md>=624&&md<=704)return {name:"Fourth of July",bg:"#030814",a:"#ef3340",b:"#ffffff",particles:["#ef3340","#ffffff","#4f83ff"]};
  if(md>=825&&md<=901)return {name:"Labor Day",bg:"#070a10",a:"#e8edf5",b:"#7393c9",particles:["#e8edf5","#7393c9","#b9c7dc"]};
  return {name:"",bg:"#050505",a:"#f5f5f2",b:"#999999",particles:["#f5f5f2","#bdbdbd","#ffffff"]};
}
const autoTheme=themeFor();
const themeCatalog={
  auto:autoTheme,
  halloween:{name:"Halloween",bg:"#08040d",a:"#ff7a00",b:"#8d4bd6",particles:["#ff7a00","#8d4bd6","#f3e6c8","#5b247a"]},
  thanksgiving:{name:"Thanksgiving",bg:"#160b04",a:"#e08a2e",b:"#f3c178",particles:["#e08a2e","#8f4e20","#f3c178","#b86b32"]},
  christmas:{name:"Christmas",bg:"#06100b",a:"#e63946",b:"#f4e8c1",particles:["#e63946","#2a9d55","#f4e8c1","#ffffff"]},
  newyear:{name:"New Year",bg:"#02040a",a:"#ffd86b",b:"#70b7ff",particles:["#ffd86b","#70b7ff","#ff6b9d","#ffffff"]},
  valentines:{name:"Valentine's",bg:"#17040b",a:"#ff4f87",b:"#ffd1df",particles:["#ff4f87","#ff8fb3","#ffd1df","#ffffff"]},
  stpatricks:{name:"St. Patrick's",bg:"#031109",a:"#35c96f",b:"#d8c36a",particles:["#35c96f","#0f7d3e","#d8c36a","#ffffff"]},
  easter:{name:"Easter",bg:"#0b0915",a:"#c9a7ff",b:"#ffe49a",particles:["#c9a7ff","#ffd0df","#b8e8d0","#ffe49a"]},
  july4:{name:"Fourth of July",bg:"#030814",a:"#ef3340",b:"#ffffff",particles:["#ef3340","#ffffff","#4f83ff"]},
  labor:{name:"Labor Day",bg:"#070a10",a:"#e8edf5",b:"#7393c9",particles:["#e8edf5","#7393c9","#b9c7dc"]}
};
let selectedTheme="auto",theme=autoTheme;
function applyTheme(key){
  selectedTheme=key; theme=themeCatalog[key]||autoTheme;
  const visualKey=key==="auto"?themeKeyForDate():key;
  document.body.dataset.theme=visualKey;
  document.documentElement.style.setProperty("--bg",theme.bg);
  document.documentElement.style.setProperty("--accent",theme.a);
  document.documentElement.style.setProperty("--accent2",theme.b);
  document.documentElement.style.setProperty("--glow",theme.a+"22");
  document.querySelector(".holiday-mark").textContent=key==="auto"?(theme.name||"Auto"):theme.name;
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.dataset.theme===key));
  buildAmbient(visualKey);
}
function themeKeyForDate(d=new Date()){
  const t=themeFor(d).name;
  return {"Halloween":"halloween","Thanksgiving":"thanksgiving","Christmas":"christmas","New Year":"newyear","Valentine's":"valentines","St. Patrick's":"stpatricks","Easter":"easter","Fourth of July":"july4","Labor Day":"labor"}[t]||"auto";
}
function buildAmbient(key){
  const box=document.querySelector(".ambient"); if(!box)return; box.innerHTML="";
  const add=(cls,n,html="")=>{for(let i=0;i<n;i++){const e=document.createElement("i");e.className=cls;e.innerHTML=html;e.style.setProperty("--x",Math.random()*100+"%");e.style.setProperty("--y",Math.random()*100+"%");e.style.setProperty("--s",(3+Math.random()*9)+"px");e.style.setProperty("--o",(.2+Math.random()*.55).toFixed(2));e.style.setProperty("--d",(5+Math.random()*8)+"s");e.style.setProperty("--delay",(-Math.random()*10)+"s");e.style.setProperty("--drift",((Math.random()-.5)*100)+"px");e.style.setProperty("--c",theme.particles[Math.floor(Math.random()*theme.particles.length)]);box.appendChild(e)}};
  if(key==="christmas")add("snow",42);
  else if(key==="halloween")add("ember",28);
  else if(key==="newyear"||key==="july4")add("sparkle",34);
  else if(key==="valentines")add("heart",18,"♥");
  else if(key==="easter")add("pastel",24);
  else if(key==="stpatricks")add("sparkle",22);
  else if(key==="thanksgiving")add("ember",16);
  else if(key==="labor")add("sparkle",15);
}
applyTheme("auto");

const backdrop=document.querySelector(".glass-backdrop"),sheet=document.querySelector(".glass-sheet"),siteButton=document.querySelector(".signature"),closeButton=document.querySelector(".glass-close"),grid=document.querySelector(".theme-grid");
const labels={auto:"Auto",halloween:"Halloween",thanksgiving:"Thanksgiving",christmas:"Christmas",newyear:"New Year",valentines:"Valentine's",stpatricks:"St. Patrick's",easter:"Easter",july4:"Fourth of July",labor:"Labor Day"};
Object.keys(themeCatalog).forEach(key=>{
  const t=themeCatalog[key],b=document.createElement("button");b.type="button";b.className="theme-btn";b.dataset.theme=key;
  const colors=t.particles.slice(0,3).map(x=>'<i style="--dot:'+x+'"></i>').join("");
  b.innerHTML='<span class="theme-name">'+labels[key]+'</span><span class="theme-dots">'+colors+'</span>';
  b.onclick=()=>{applyTheme(key);closeMenu();setTimeout(run,260)};grid.appendChild(b);
});
applyTheme("auto");
function openMenu(){backdrop.classList.add("open");sheet.classList.add("open");closeButton.focus()}
function closeMenu(){backdrop.classList.remove("open");sheet.classList.remove("open");siteButton.focus()}
siteButton.onclick=openMenu;closeButton.onclick=closeMenu;backdrop.onclick=closeMenu;addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
const msg=document.querySelector(".message"),stage=document.querySelector(".stage"),flash=document.querySelector(".flash"),shock=document.querySelector(".shock"),after=document.querySelector(".after"),replay=document.querySelector(".replay");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,sleep=ms=>new Promise(r=>setTimeout(r,ms));let id=0;
async function phrase(text,hold,token){if(token!==id)return;msg.className="message"+(text==="Goodbye."?" goodbye":"");msg.textContent=text;void msg.offsetWidth;msg.classList.add("show");await sleep(hold);if(token!==id)return;msg.classList.add("leave");await sleep(480)}
function burst(){
  document.body.classList.add("dissolving");
  if(reduced)return;
  const rect=msg.getBoundingClientRect(),count=Math.min(520,Math.max(260,Math.floor(rect.width*1.25)));
  const styles=getComputedStyle(msg),dustColors=[styles.color,theme.a,theme.b,"#a9a9a9","#6f6f6f"];
  for(let i=0;i<count;i++){
    const p=document.createElement("i"),progress=Math.random(),edge=Math.pow(progress,.72);
    p.className="dust"+(Math.random()<.12?" smoke":"");
    const x=rect.left+rect.width*edge+(Math.random()-.5)*8;
    const y=rect.top+Math.random()*rect.height;
    const size=.7+Math.random()*(Math.random()<.12?5.5:2.6);
    const drift=55+Math.random()*190+edge*90;
    p.style.setProperty("--x0",x+"px");p.style.setProperty("--y0",y+"px");
    p.style.setProperty("--s",size+"px");p.style.setProperty("--o",(.25+Math.random()*.72).toFixed(2));
    p.style.setProperty("--round",Math.random()<.7?"50%":Math.floor(Math.random()*45)+"%");
    p.style.setProperty("--blur",Math.random()*5+"px");
    p.style.setProperty("--dust",dustColors[Math.floor(Math.random()*dustColors.length)]);
    p.style.setProperty("--dx",(drift+Math.random()*90)+"px");
    p.style.setProperty("--dy",(-35+(Math.random()-.5)*150)+"px");
    p.style.setProperty("--rot",((Math.random()-.5)*720)+"deg");
    p.style.setProperty("--dur",(1050+Math.random()*1150)+"ms");
    p.style.setProperty("--delay",(edge*620+Math.random()*240)+"ms");
    stage.appendChild(p);p.onanimationend=()=>p.remove();
  }
  // a sparse cloud of ash makes the disintegration feel volumetric instead of confetti-like
  for(let i=0;i<75;i++){
    const p=document.createElement("i");p.className="dust smoke";
    p.style.setProperty("--x0",(rect.left+Math.random()*rect.width)+"px");
    p.style.setProperty("--y0",(rect.top+Math.random()*rect.height)+"px");
    p.style.setProperty("--s",(2+Math.random()*6)+"px");p.style.setProperty("--o",(.12+Math.random()*.28).toFixed(2));
    p.style.setProperty("--round","50%");p.style.setProperty("--blur",(3+Math.random()*8)+"px");
    p.style.setProperty("--dust","#8a8a8a");p.style.setProperty("--dx",(110+Math.random()*260)+"px");
    p.style.setProperty("--dy",(-70+(Math.random()-.5)*180)+"px");p.style.setProperty("--rot",((Math.random()-.5)*360)+"deg");
    p.style.setProperty("--dur",(1500+Math.random()*1200)+"ms");p.style.setProperty("--delay",(Math.random()*700)+"ms");
    stage.appendChild(p);p.onanimationend=()=>p.remove();
  }
}
async function run(){const token=++id;document.body.classList.remove("exploding","dissolving");document.querySelectorAll(".dust").forEach(e=>e.remove());after.classList.remove("show");flash.classList.remove("go");shock.classList.remove("go");msg.className="message";await sleep(250);for(const [t,h] of phrases){await phrase(t,h,token);await sleep(130)}if(token!==id)return;msg.textContent="Goodbye.";msg.className="message goodbye show";await sleep(170);burst();await sleep(reduced?450:2450);if(token===id)after.classList.add("show")}
replay.onclick=run;run();
</script>
</body>
</html>
